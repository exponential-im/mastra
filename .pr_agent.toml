[config]
# GLM 5.3 through OpenRouter, the same as exponential-im/exponential. The key and
# which tools run (review only) live in .github/workflows/pr-agent.yml.
model = "openrouter/z-ai/glm-5.3"
fallback_models = ["openrouter/z-ai/glm-5.2"]
# Lets PR-Agent budget the diff even if its bundled litellm has no registry entry
# for the model. The effective diff budget is max_model_tokens.
custom_model_max_tokens = 200000
# PR-Agent's default is 32k; bigger diffs get a partial review, which the gate holds.
max_model_tokens = 128000
publish_output = true

[openrouter]
# Serve GLM only from Z.AI's own endpoint, not the cheapest of ~40 OpenRouter
# hosts (some run cut-down builds, and each would see our diffs). If Z.AI is down
# the call fails and the check goes red.
provider_only = ["z-ai"]

[pr_reviewer]
# Raised from 4 so a tight cap doesn't discard real findings. Matches
# exponential-im/exponential.
num_max_findings = 8
require_tests_review = true
# The auto-merge gate reads the review's 🔒 row and treats a missing one as a
# concern, so keep this on.
require_security_review = true
persistent_comment = true
final_update_message = false
extra_instructions = """
Severity — begin the header of every key issue with exactly one tag, then the title
as usual (e.g. "[blocker] JWT accepted without verifying the signature"):
[blocker] — merging this commit as-is would ship a bug, a security hole, data loss,
a leak of one user's or workspace's data to another, or a build/CI failure.
[minor] — everything else, including anything you are not confident is a real
problem (a "worth confirming", "may", or "could" finding is minor).
An automated merge gate reads these tags: a [blocker] holds the PR for a human, a
[minor] does not. Tag honestly in both directions.
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 4
persistent_comment = true

[pr_description]
persistent_comment = true
