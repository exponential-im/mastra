name: Test

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm run test

  # The contract test reads a copy of the app's procedure contract
  # (docs/tool-contracts.md). This job fails when the copy is behind the app.
  contract-drift:
    name: Contract copy is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script has no dependencies, so there is no install step.
      # --allow-missing: passes with a warning while the app's main has no
      # contract file. Remove the flag when the app's contract is on main.
      - name: Compare the copy with the app's main
        run: node scripts/sync-contract.mjs --check --allow-missing
